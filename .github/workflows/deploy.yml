name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (portfolio)
        working-directory: ./lecture1/_template_settings
        run: npm install

      - name: Build (portfolio)
        working-directory: ./lecture1/_template_settings
        run: npm run build

      - name: Install dependencies (game community)
        working-directory: ./lecture1/my-community
        run: npm install

      - name: Build (game community)
        working-directory: ./lecture1/my-community
        run: npm run build

      - name: Install dependencies (mini sns)
        working-directory: ./lecture1/mini_sns
        run: npm install

      - name: Build (mini sns)
        working-directory: ./lecture1/mini_sns
        run: npm run build

      - name: Prepare deploy structure
        run: |
          mkdir -p deploy/lecture1/mini_sns
          cp -r ./lecture1/_template_settings/dist/. deploy/
          cp -r ./lecture1/my-community/dist/. deploy/lecture1/
          cp -r ./lecture1/mini_sns/dist/. deploy/lecture1/mini_sns/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
